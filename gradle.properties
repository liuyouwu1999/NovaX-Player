# daemon 必须 UTF-8：AGP externalNativeBuild 把 ninja 命令持久化到 .cxx 下 JSON（UTF-8 写），
# GBK daemon 回读即 mojibake，ninja chdir 必败（2026-09-29 Task3 实证：GBK 时 buildCMakeDebug
# 全 ABI 挂在 chdir No such file or directory；UTF-8 全过）。media3-ffmpeg-ext 模块加入构建后，
# 任何 :app 打包都会触发 native 编译，故 daemon 常驻 UTF-8。
# 代价（已知，继承自中文项目路径）：跑 :app 单测若报 ClassNotFoundException（test worker
# classpath @argfile 被 java launcher 按 GBK 解码），给该次调用加 daemon 覆盖即可：
#   ./gradlew -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=GBK" :app:testDebugUnitTest
# （2026-09-29 实证该覆盖下单测通过；argfile 由 daemon 按 file.encoding 写、launcher 按 ANSI 读，无法双全）
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
org.gradle.configuration-cache=true
org.gradle.caching=true
android.overridePathCheck=true
